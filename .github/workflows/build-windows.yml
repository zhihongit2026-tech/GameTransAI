name: Build Windows EXE V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'tests/fixtures/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Unit tests and REAL screenshot OCR
        env:
          GAMETRANS_OCR_INTEGRATION: '1'
          QT_QPA_PLATFORM: 'offscreen'
        run: python -m unittest discover -s tests -v
      - name: Package Windows EXE with RapidOCR models
        run: >-
          python -m PyInstaller --clean --noconfirm --onedir --windowed
          --name GameTransAI --collect-all rapidocr
          --collect-all onnxruntime --collect-all dxcam
          --collect-data cv2 main.py
      - name: Bundled EXE real-image OCR smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/GameTransAI/GameTransAI.exe'
          if (-not (Test-Path $exe)) { throw 'GameTransAI.exe missing' }
          $fixture = Join-Path $PWD 'tests/fixtures/douluo_settings.jpg.b64'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--ocr-self-test',$fixture) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "OCR self-test failure: $($proc.ExitCode)" }
      - name: Bundled EXE V3 offline/Qt smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: 'offscreen'
        run: |
          $exe = Join-Path $PWD 'dist/GameTransAI/GameTransAI.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--v3-self-test') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "V3 self-test failure: $($proc.ExitCode)" }
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/GameTransAI/GameTransAI.exe'
          if (-not (Test-Path $exe)) { throw 'GameTransAI.exe missing' }
          Get-Item $exe | Select-Object Name,Length
      - name: Upload V3 EXE bundle
        uses: actions/upload-artifact@v4
        with:
          name: GameTransAI-V3-Windows-x64
          path: dist/GameTransAI/
          if-no-files-found: error
          retention-days: 30
