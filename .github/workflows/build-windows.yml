name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package desktop application
        run: >-
          python -m PyInstaller --clean --noconfirm --onedir --windowed
          --name GameTransAI --collect-all rapidocr
          --collect-all onnxruntime --collect-all dxcam
          --collect-data cv2 main.py
      - name: Check Windows executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/GameTransAI/GameTransAI.exe')) { throw 'Missing GameTransAI.exe' }
          Get-Item 'dist/GameTransAI/GameTransAI.exe' | Select-Object Name,Length
      - name: Publish executable bundle as ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameTransAI-Windows-x64
          path: dist/GameTransAI/
          if-no-files-found: error
          retention-days: 30
