name: Game Recorder 4min - repair room connection

on:
  push:
    branches: [build/game-recorder-0.3.8-4min]
    paths:
      - .github/workflows/repair-game-recorder-room.yml
  workflow_dispatch:

jobs:
  repair:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download tested Windows build
        uses: actions/download-artifact@v4
        with:
          name: Game-Recorder-0.3.8-4min-Windows-x64
          run-id: 45178692468
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous

      - name: Download the original official 0.3.8 distribution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path official -Force | Out-Null
          gh release download capture-v0.3.8 -R trquoccuong/Game-Recorder -p odx-capture-0.3.8-win-x64.zip -D official
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the official 0.3.8 package' }
          $source = 'official/odx-capture-0.3.8-win-x64.zip'
          if (-not (Test-Path $source)) { throw 'Official zip was not downloaded' }
          $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '4e10a47ec7c4b51ab316ed8a4ae41646157ffb1165e85bc82e1463d78ed9d741') {
            throw "Original ZIP digest mismatch: $hash"
          }
          Write-Host 'Original 0.3.8 ZIP verified'

      - name: Restore released server config without changing any executable
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $oldZip = 'previous/odx-capture-0.3.8-4min-win-x64.zip'
          if (-not (Test-Path $oldZip)) { throw 'Prior built portable package not found' }
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $oldZip).Path, (Join-Path $PWD 'fixed'))

          $officialZip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'official/odx-capture-0.3.8-win-x64.zip').Path)
          try {
            $entries = @($officialZip.Entries | Where-Object {
              $_.FullName -match '(^|/)bin/odx-capture\\.json$'
            })
            if ($entries.Count -ne 1) { throw "Expected one official odx-capture.json: found $($entries.Count)" }
            $original = $entries[0]
            $sourceStream = $original.Open()
            $buffer = [IO.MemoryStream]::new()
            try { $sourceStream.CopyTo($buffer) } finally { $sourceStream.Dispose() }
            $configBytes = $buffer.ToArray()
            $config = [Text.Encoding]::UTF8.GetString($configBytes) | ConvertFrom-Json
            if (-not $config.orchestrator -or $config.orchestrator -match 'example\\.com') {
              throw 'Original distribution does not have a configured orchestrator'
            }

            $target = 'fixed/odx-capture-0.3.8-4min-win-x64/bin/odx-capture.json'
            if (-not (Test-Path $target)) { throw 'Built package has no expected bin/odx-capture.json' }
            $incorrect = Get-Content $target -Raw | ConvertFrom-Json
            if ($incorrect.orchestrator -notmatch 'example\\.com') {
              throw 'Unexpected prior package: refusing to replace configuration'
            }
            [IO.File]::WriteAllBytes((Join-Path $PWD $target), $configBytes)

            $check = [IO.File]::ReadAllBytes((Join-Path $PWD $target))
            if (-not [Linq.Enumerable]::SequenceEqual([byte[]]$configBytes, [byte[]]$check)) {
              throw 'Recovered configuration does not match the official distribution'
            }
            Write-Host 'Official server configuration restored; credentials were not printed'
          }
          finally { $officialZip.Dispose() }

          New-Item -ItemType Directory -Path output -Force | Out-Null
          $outputZip = (Join-Path $PWD 'output/odx-capture-0.3.8-4min-ROOM-FIXED-win-x64.zip')
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $PWD 'fixed'), $outputZip,
            [IO.Compression.CompressionLevel]::Optimal, $false)
          $zipCheck = [IO.Compression.ZipFile]::OpenRead($outputZip)
          try {
            $entry = $zipCheck.Entries | Where-Object { $_.FullName -match '(^|/)bin/odx-capture\\.json$' } | Select-Object -First 1
            if (-not $entry) { throw 'Final zip is missing the room configuration' }
            if (-not ($zipCheck.Entries | Where-Object { $_.FullName -match '/Odx Capture\\.exe$' })) {
              throw 'Final zip is missing Odx Capture.exe'
            }
          } finally { $zipCheck.Dispose() }
          Write-Host 'Room-fixed Windows executable package created and verified'

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Game-Recorder-0.3.8-4min-ROOM-FIXED-Windows-x64
          path: output/odx-capture-0.3.8-4min-ROOM-FIXED-win-x64.zip
          retention-days: 7
          if-no-files-found: error
